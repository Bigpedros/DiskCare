name: Validate DiskCare

on:
  push:
    branches:
      - diskcare-v1.0
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f assets/diskcare-icon.png
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
      - name: Package Netlify Drop ZIP
        run: |
          mkdir -p dist-package
          cp index.html styles.css app.js manifest.webmanifest netlify.toml sw.js dist-package/
          cp -R assets dist-package/assets
      - name: Upload Netlify package
        uses: actions/upload-artifact@v4
        with:
          name: DiskCare-UX-Guidata
          path: dist-package/
          if-no-files-found: error
