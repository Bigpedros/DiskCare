name: Validate DiskCare

on:
  push:
    branches:
      - diskcare-v1.0
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f assets/diskcare-icon.png
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"
